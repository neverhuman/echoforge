write_policy = "generator_only"

[[zone]]
path = "target/jankurai"
source = "rtk jankurai doctor . --fail-on critical"
command = "rtk jankurai doctor . --fail-on critical --json target/jankurai/doctor.json --md target/jankurai/doctor.md"
read_only = false
write_policy = "auditor_output"

