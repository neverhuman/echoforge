[package]
name = "echoforge-cli"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
clap = { version = "4.5", features = ["derive"] }
echoforge-dataset = { path = "../echoforge-dataset" }
echoforge-radar = { path = "../echoforge-radar" }
echoforge-validate = { path = "../echoforge-validate" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[dev-dependencies]
tempfile = "3.13"

[[bin]]
name = "ef"
path = "src/main.rs"

[[example]]
name = "inspect-manifest"
path = "../../examples/inspect_manifest.rs"

[[test]]
name = "schema"
path = "../../tests/cli/schema.rs"

[[test]]
name = "manifest"
path = "../../tests/cli/manifest.rs"

[[test]]
name = "doctor"
path = "../../tests/cli/doctor.rs"

[[test]]
name = "demo"
path = "../../tests/cli/demo.rs"
