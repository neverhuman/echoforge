[package]
name = "echoforge-dataset"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
csv = "1.3"
echoforge-core = { path = "../echoforge-core" }
echoforge-radar = { path = "../echoforge-radar" }
echoforge-sig = { path = "../echoforge-sig" }
indicatif = "0.17"
ndarray = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
smartcore = { version = "0.4", default-features = false }

[dev-dependencies]
sha2 = "0.10"
tempfile = "3"
