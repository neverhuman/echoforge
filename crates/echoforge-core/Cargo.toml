[package]
name = "echoforge-core"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
schemars = "0.8"
jsonschema = "0.18"
proptest = "1"

[[bin]]
name = "emit_canonical"
path = "src/bin/emit_canonical.rs"
