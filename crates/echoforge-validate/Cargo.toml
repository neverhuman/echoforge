[package]
name = "echoforge-validate"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
echoforge-core = { path = "../echoforge-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ndarray = "0.16"
num-complex = "0.4"

[dev-dependencies]
approx = "0.5"
tempfile = "3"
