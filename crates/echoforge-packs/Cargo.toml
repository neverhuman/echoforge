[package]
name = "echoforge-packs"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
anyhow = "1"
echoforge-core = { path = "../echoforge-core" }
jsonschema = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "2"
url = "2"
walkdir = "2"

[dev-dependencies]
tempfile = "3.13"
