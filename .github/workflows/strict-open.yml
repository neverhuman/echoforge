name: strict-open

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - README.md
      - assets/**
  push:
    branches:
      - main
    paths-ignore:
      - README.md
      - assets/**

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vendor-scrub:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e
        with:
          node-version: '26.1.0'
      - name: Vendor scrub lane
        shell: bash
        run: bash ops/ci/vendor-scrub.sh

  receipts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e
        with:
          node-version: '26.1.0'
      - name: Receipts lane
        shell: bash
        run: bash ops/ci/receipts.sh

  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: 1.95.0
      - uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e
        with:
          node-version: '26.1.0'
      - name: Install cargo-deny
        shell: bash
        run: cargo install cargo-deny --locked
      - name: Dependency audit (cargo deny)
        shell: bash
        run: cargo deny check
      - name: Secret scan (trufflehog)
        uses: trufflesecurity/trufflehog@37b77001d0174ebec2fcca2bd83ff83a6d45a3ab  # v3.95.3
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified
      - name: Security lane
        shell: bash
        run: bash ops/ci/security.sh
