name: jankurai-bootstrap

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - README.md
      - assets/**
  push:
    branches:
      - main
    paths-ignore:
      - README.md
      - assets/**

jobs:
  bootstrap:
    if: github.event_name != "pull_request"
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Advisory scaffold check
        shell: bash
        run: |
          set -euo pipefail
          for path in \
            AGENTS.md \
            .gitignore \
            Justfile \
            Cargo.toml \
            pyproject.toml \
            package.json \
            agent/owner-map.json \
            agent/test-map.json \
            agent/generated-zones.toml
          do
            test -f "$path"
          done
          echo "EchoForge bootstrap scaffold is present."

  vendor-scrub:
    if: github.event_name != "pull_request"
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Vendor-name scrub
        run: node tools/vendor_scrub.mjs

  receipt-audit:
    if: github.event_name != "pull_request"
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Receipt guard
        run: node tools/receipt_guard.mjs --all
