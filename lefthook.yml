# EchoForge git hooks via lefthook (https://lefthook.dev). Install once:
#
#   brew install lefthook   # or: npm i -D lefthook
#   lefthook install
#
# Hooks run on staged files only where possible. Rust hooks scope to the
# whole workspace because cargo's incremental compile makes that fast and
# lint drift on unchanged files would otherwise rot silently.

min_version: 1.7.0

pre-commit:
  parallel: true
  commands:
    rustfmt:
      glob: "*.rs"
      run: cargo fmt --all -- --check
      stage_fixed: false
    clippy:
      glob: "*.rs"
      run: cargo clippy --workspace --all-targets --locked -- -D warnings
    ruff-format:
      glob: "*.py"
      run: ruff format --check {staged_files}
    ruff-check:
      glob: "*.py"
      run: ruff check {staged_files}
    biome:
      glob: "*.{mjs,js,ts,tsx,json,jsonc}"
      run: npx --yes @biomejs/biome check {staged_files}
    schema-validate:
      glob: "schemas/**/*.json"
      run: rtk cargo test -p echoforge-contracts-smoke --locked
    vendor-scrub:
      run: node tools/vendor_scrub.mjs --staged
    receipts-staged:
      run: node tools/receipt_guard.mjs --staged

pre-push:
  parallel: false
  commands:
    # Secondary guard: lefthook runs *after* the wrapper reads stdin.
    # This command catches the case where lefthook is invoked directly
    # (not via git push), e.g. `lefthook run pre-push` in CI dry-runs.
    no-push-to-main:
      run: |
        branch="$(git rev-parse --abbrev-ref HEAD)"
        if [ "$branch" = "main" ]; then
          printf '\n[protect-main] BLOCKED: You are on the main branch.\nSwitch to a feature branch and open a PR instead.\n\n' >&2
          exit 1
        fi
    fast:
      run: just fast
