# default at
# crates/echoforge-radar/src/detectors/micro_doppler_classifier.rs.
# Reference signatures encoded as per-feature mean ± 1 sigma cited to
# Chen 2011, Tahmoush 2015, Rahman & Robertson Nature Sci Rep 2018,
# MDPI Drones 2023.
