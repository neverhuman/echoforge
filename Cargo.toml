[workspace]
resolver = "2"
members = [
    "crates/echoforge-cli",
    "crates/echoforge-core",
    "crates/echoforge-solver-contract",
    "crates/echoforge-solver-sagitta",
    "crates/echoforge-studio",
    "crates/echoforge-dataset",
    "crates/echoforge-hardneg-mining",
    "crates/echoforge-radar",
    "crates/echoforge-sig",
    "crates/echoforge-validate",
    "crates/echoforge-world",
    "tests/contracts",
    "tests/gpu",
    "tests/radar_chain",
    "tests/science",
]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
version = "0.2.11"

[workspace.metadata.echoforge]
strict_open = true
radar_first = true
bootstrap_mode = "advisory"
